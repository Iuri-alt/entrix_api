# Blueprint do Render: API + PostgreSQL.
# O disco do Render é apagado a cada deploy/reinício, por isso os dados
# precisam ficar no PostgreSQL (DATABASE_URL), nunca em SQLite.
services:
  - type: web
    name: entrix-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: entrix-db
          property: connectionString

databases:
  - name: entrix-db
    plan: free
